name: Daily upstream sync

on:
  schedule:
    # 03:17 UTC / 11:17 China Standard Time. The non-round minute avoids the
    # busiest part of GitHub's scheduled-run queue.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and test even when the upstream SHA is unchanged
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    name: Replay downstream patches
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.sync.outputs.state }}
      target_sha: ${{ steps.sync.outputs.target_sha }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
      base_sha: ${{ steps.sync.outputs.base_sha }}
      candidate_sha: ${{ steps.sync.outputs.candidate_sha }}
      conflict_files: ${{ steps.sync.outputs.conflict_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/english-fuzzy-translation
          fetch-depth: 0
      - name: Prepare candidate branch
        id: sync
        env:
          TARGET_BRANCH: feature/english-fuzzy-translation
          CANDIDATE_BRANCH: automation/upstream-sync
          UPSTREAM_URL: https://github.com/fcitx/fcitx5-chinese-addons.git
          UPSTREAM_BRANCH: master
          FORCE_SYNC: ${{ inputs.force || 'false' }}
        run: |
          cp .github/scripts/prepare-upstream-sync.sh /tmp/prepare-upstream-sync
          bash /tmp/prepare-upstream-sync

  clang-format:
    name: Check candidate clang-format
    needs: prepare
    if: needs.prepare.outputs.state == 'ready'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git clang diffutils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
      - uses: fcitx/github-actions@clang-format

  test:
    name: Test candidate (${{ matrix.compiler }})
    needs: [prepare, clang-format]
    if: needs.prepare.outputs.state == 'ready'
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm base-devel clang cmake ninja extra-cmake-modules fmt libuv boost boost-libs git qt6-base qt6-wayland libxkbcommon qt6-webengine lua opencc
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          repository: fcitx/fcitx5
          path: fcitx5
      - name: Cache fcitx5 data files
        uses: actions/cache@v4
        with:
          path: "fcitx5/**/*.tar.*"
          key: ${{ runner.os }}-sync-${{ hashFiles('fcitx5/src/modules/spell/CMakeLists.txt') }}
      - name: Build and install fcitx5
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5
          cmake-option: >-
            -DENABLE_KEYBOARD=Off -DENABLE_X11=Off -DENABLE_WAYLAND=Off -DENABLE_ENCHANT=Off
            -DENABLE_DBUS=Off -DENABLE_SERVER=Off -DENABLE_EMOJI=Off -DUSE_SYSTEMD=Off
      - uses: actions/checkout@v4
        with:
          repository: fcitx/libime
          path: libime
          submodules: true
      - name: Cache libime data files
        uses: actions/cache@v4
        with:
          path: "libime/**/*.tar.*"
          key: ${{ runner.os }}-sync-${{ hashFiles('libime/data/CMakeLists.txt') }}
      - name: Build and install libime
        uses: fcitx/github-actions@cmake
        with:
          path: libime
      - uses: actions/checkout@v4
        with:
          repository: fcitx/fcitx5-lua
          path: fcitx5-lua
      - name: Build and install fcitx5-lua
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5-lua
      - uses: actions/checkout@v4
        with:
          repository: fcitx/fcitx5-qt
          path: fcitx5-qt
      - name: Build and install fcitx5-qt
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5-qt
          cmake-option: >-
            -DENABLE_QT4=Off -DENABLE_QT5=Off -DENABLE_QT6=On
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          path: fcitx5-chinese-addons
      - name: Build and install fcitx5-chinese-addons
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5-chinese-addons
      - name: Run complete test suite
        run: ctest --test-dir fcitx5-chinese-addons/build --output-on-failure

  promote:
    name: Promote tested candidate
    needs: [prepare, clang-format, test]
    if: >-
      needs.prepare.outputs.state == 'ready' &&
      needs.clang-format.result == 'success' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/english-fuzzy-translation
          fetch-depth: 0
      - name: Atomically update the downstream branch
        env:
          TARGET_BRANCH: feature/english-fuzzy-translation
          EXPECTED_OLD_SHA: ${{ needs.prepare.outputs.target_sha }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        run: |
          git fetch origin "$CANDIDATE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          git push origin \
            "$CANDIDATE_SHA:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_OLD_SHA"
          {
            echo "## Upstream sync promoted"
            echo "- Upstream: \`$UPSTREAM_SHA\`"
            echo "- Downstream: \`$CANDIDATE_SHA\`"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Close a previous sync issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Automated upstream sync needs attention";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of issues.filter(issue => issue.title === title)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

  report-failure:
    name: Report blocked sync
    needs: [prepare, clang-format, test, promote]
    if: >-
      ${{ always() && (
        needs.prepare.result != 'success' ||
        needs.prepare.outputs.state == 'conflict' ||
        (needs.prepare.outputs.state == 'ready' && (
          needs.clang-format.result != 'success' ||
          needs.test.result != 'success' ||
          needs.promote.result != 'success'
        ))
      ) }}
    runs-on: ubuntu-latest
    env:
      SYNC_STATE: ${{ needs.prepare.outputs.state }}
      CONFLICT_FILES: ${{ needs.prepare.outputs.conflict_files }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
      PREPARE_RESULT: ${{ needs.prepare.result }}
      FORMAT_RESULT: ${{ needs.clang-format.result }}
      TEST_RESULT: ${{ needs.test.result }}
      PROMOTE_RESULT: ${{ needs.promote.result }}
    steps:
      - name: Create or update the sync issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Automated upstream sync needs attention";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The daily upstream replay was not promoted.",
              "",
              `- State: \`${process.env.SYNC_STATE || "workflow failure"}\``,
              `- Previous base: \`${process.env.BASE_SHA || "unknown"}\``,
              `- Upstream head: \`${process.env.UPSTREAM_SHA || "unknown"}\``,
              `- Conflicts: \`${process.env.CONFLICT_FILES || "none reported"}\``,
              `- Prepare: \`${process.env.PREPARE_RESULT}\``,
              `- Format: \`${process.env.FORMAT_RESULT}\``,
              `- Tests: \`${process.env.TEST_RESULT}\``,
              `- Promotion: \`${process.env.PROMOTE_RESULT}\``,
              "",
              `[Open workflow run](${runUrl})`,
              "",
              "The stable downstream branch was left unchanged.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Another sync attempt was blocked: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
